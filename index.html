<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Hotel</title>
    <meta name="description" content="A 2D top-down tactical shooter set in a dark luxury hotel." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310090c'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='36' text-anchor='middle' fill='%23c9a45c'%3EH%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-mark">H</div>
        <div class="boot-title">PROJECT HOTEL</div>
        <div class="boot-bar"><span id="boot-progress"></span></div>
        <div class="boot-pct" id="boot-pct">0%</div>
        <div class="boot-status" id="boot-status">Preparing the hotel…</div>
        <div class="boot-tip" id="boot-tip"></div>
        <script>
          (function () {
            var tips = [
              '<b>Tip:</b> stand still in a dark corner and you will hide automatically.',
              '<b>Tip:</b> hold your aim on a target — the crosshair locks on and your shots get accurate.',
              '<b>Tip:</b> sofas and counters stop bullets. Use them.',
              '<b>Tip:</b> every guard carries a flashlight. If you can see the beam, they can see yours.',
              '<b>Tip:</b> glowing rings on the floor mark weapons, ammo and armor.'
            ];
            var el = document.getElementById('boot-tip'), i = Math.floor(Math.random() * tips.length);
            el.innerHTML = tips[i];
            setInterval(function () { i = (i + 1) % tips.length; el.innerHTML = tips[i]; }, 2600);
          })();
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
